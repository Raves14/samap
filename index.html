<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free South America Video Map</title>
    <!-- Load the free MapLibre library -->
    <script src="https://unpkg.com"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; background-color: #000; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Initialize the map centered broadly over South America
    const map = new maplibregl.Map({
        container: 'map',
        // Using OpenFreeMap's completely free, public POSITRON style
        style: 'https://openfreemap.org', 
        center: [-60.0, -15.0], // Longitude, Latitude for South America
        zoom: 3.5, // Initial zoom level to fit the continent
        attributionControl: false // Removes text clutter for clean video recording
    });
</script>

</body>
</html>
