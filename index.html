<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free South America Video Map</title>
    <!-- FIXED: Added full paths to load the MapLibre engine -->
    <script src="https://unpkg.com"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100%; height: 100%; background-color: #000; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        // FIXED: Pointed to the actual, live OpenFreeMap tile style endpoint
        style: 'https://openfreemap.org', 
        center: [-60.0, -15.0], 
        zoom: 3.5, 
        attributionControl: false 
    });
</script>

</body>
</html>
