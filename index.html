<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>South America Map</title>

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <link
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
        rel="stylesheet"
    />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',

        // Clean dark OpenFreeMap style
        style: 'https://tiles.openfreemap.org/styles/dark',

        // South America
        center: [-60, -15],

        zoom: 3.5,

        pitch: 0,
        bearing: 0
    });

    map.on('load', () => {
        console.log('Map loaded successfully');
    });
</script>

</body>
</html>
